<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IGEV - Intuitive Gantt Editor and Viewer</title>

    <script src="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@8.0.6/codebase/dhtmlxgantt.js"></script>
    <link id="ganttSkinLink" href="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@8.0.6/codebase/dhtmlxgantt.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/300.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/700.css" rel="stylesheet">

    <style>
        /* =================================================================== */
        /* THEME CSS VARIABLES (Light is default)                            */
        /* =================================================================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f5f7;
            --bg-tertiary: #e1e4e8;
            --bg-elevated: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-tertiary: #888888;
            --border-color: #cecece;
            --border-light: #ebebeb;
            --accent: #0288d1;
            --accent-hover: #0277bd;
            --accent-text: #ffffff;
            --success: #2e7d32;
            --success-hover: #1b5e20;
            --danger: #d32f2f;
            --danger-hover: #b71c1c;
            --warning: #ff9800;
            --weekend-bg: #f4f7f4;
            --gantt-row-alt: #fafafa;
            --gantt-header: #f5f5f5;
            --gantt-header-text: #424242;
            --gantt-border: #ebebeb;
            --gantt-cell-hover: rgba(0, 136, 209, 0.05);
            --today-line: #ff5252;
            --modal-bg: rgba(0,0,0,0.5);
            --shadow: rgba(0,0,0,0.12);
            --shadow-strong: rgba(0,0,0,0.25);
            --button-secondary-bg: #ffffff;
            --button-secondary-text: #333333;
            --button-secondary-border: #cccccc;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --tooltip-bg: rgba(50, 50, 50, 0.95);
            --tooltip-text: #ffffff;
        }

        /* DARK THEME */
        .theme-dark {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2a2a2a;
            --bg-tertiary: #3a3a3a;
            --bg-elevated: #2f2f2f;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --text-tertiary: #888888;
            --border-color: #444444;
            --border-light: #3a3a3a;
            --accent: #4fc3f7;
            --accent-hover: #29b6f6;
            --accent-text: #0a0a0a;
            --success: #66bb6a;
            --success-hover: #4caf50;
            --danger: #ef5350;
            --danger-hover: #e53935;
            --warning: #ffb74d;
            --weekend-bg: #262626;
            --gantt-row-alt: #242424;
            --gantt-header: #2d2d2d;
            --gantt-header-text: #cccccc;
            --gantt-border: #383838;
            --gantt-cell-hover: rgba(79, 195, 247, 0.08);
            --today-line: #ff8a80;
            --modal-bg: rgba(0,0,0,0.75);
            --shadow: rgba(0,0,0,0.4);
            --shadow-strong: rgba(0,0,0,0.6);
            --button-secondary-bg: #333333;
            --button-secondary-text: #e0e0e0;
            --button-secondary-border: #555555;
            --input-bg: #2a2a2a;
            --input-border: #555555;
            --tooltip-bg: rgba(240, 240, 240, 0.95);
            --tooltip-text: #1e1e1e;
        }

        /* MATERIAL THEME (purple/teal modern flat) */
        .theme-material {
            --bg-primary: #fafafa;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e0e0e0;
            --bg-elevated: #ffffff;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-tertiary: #9e9e9e;
            --border-color: #e0e0e0;
            --border-light: #eeeeee;
            --accent: #673ab7;
            --accent-hover: #5e35b1;
            --accent-text: #ffffff;
            --success: #009688;
            --success-hover: #00796b;
            --danger: #f44336;
            --danger-hover: #d32f2f;
            --warning: #ff9800;
            --weekend-bg: #f1f8e9;
            --gantt-row-alt: #fcfcfc;
            --gantt-header: #eeeeee;
            --gantt-header-text: #424242;
            --gantt-border: #e0e0e0;
            --gantt-cell-hover: rgba(103, 58, 183, 0.06);
            --today-line: #e91e63;
            --modal-bg: rgba(33, 33, 33, 0.6);
            --shadow: rgba(0,0,0,0.1);
            --shadow-strong: rgba(0,0,0,0.2);
            --button-secondary-bg: #ffffff;
            --button-secondary-text: #212121;
            --button-secondary-border: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #bdbdbd;
            --tooltip-bg: rgba(33, 33, 33, 0.92);
            --tooltip-text: #ffffff;
        }

        /* HIGH CONTRAST THEME (Accessibility) */
        .theme-contrast {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-elevated: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #ffffff;
            --text-tertiary: #f5f5f5;
            --border-color: #ffffff;
            --border-light: #ffffff;
            --accent: #ffeb3b;
            --accent-hover: #fdd835;
            --accent-text: #000000;
            --success: #00e676;
            --success-hover: #00c853;
            --danger: #ff1744;
            --danger-hover: #d50000;
            --warning: #ffa726;
            --weekend-bg: #0a0a0a;
            --gantt-row-alt: #050505;
            --gantt-header: #111111;
            --gantt-header-text: #ffffff;
            --gantt-border: #ffffff;
            --gantt-cell-hover: rgba(255, 235, 59, 0.15);
            --today-line: #ffeb3b;
            --modal-bg: rgba(0,0,0,0.9);
            --shadow: rgba(255,255,255,0.15);
            --shadow-strong: rgba(255,255,255,0.3);
            --button-secondary-bg: #000000;
            --button-secondary-text: #ffffff;
            --button-secondary-border: #ffffff;
            --input-bg: #000000;
            --input-border: #ffffff;
            --tooltip-bg: #ffffff;
            --tooltip-text: #000000;
        }

        /* =================================================================== */
        /* BASE STYLES (theme-aware)                                           */
        /* =================================================================== */
        html, body {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif; overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.25s, color 0.25s;
        }
        body {
            display: flex; flex-direction: column;
            height: 100dvh;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        .controls {
            min-height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 20px;
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box; z-index: 10; position: relative;
            flex: 0 0 auto; flex-wrap: wrap; row-gap: 8px;
            transition: background-color 0.25s, border-color 0.25s;
        }

        .controls h2 {
            margin: 0; font-size: 1.2rem; color: var(--text-primary);
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

        .instruction { 
            color: var(--text-secondary); font-size: 0.85rem; 
            background: var(--bg-tertiary); padding: 5px 12px; 
            border-radius: 15px; margin-right: 15px;
            transition: background-color 0.25s, color 0.25s;
        }

        button {
            background-color: var(--accent); color: var(--accent-text); border: none;
            padding: 8px 16px; border-radius: 4px; cursor: pointer;
            font-size: 0.9rem; transition: background 0.2s, transform 0.1s, color 0.2s, border-color 0.2s;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        button:hover { background-color: var(--accent-hover); }
        button:active { transform: translateY(1px); }
        button.secondary {
            background-color: var(--button-secondary-bg);
            color: var(--button-secondary-text);
            border: 1px solid var(--button-secondary-border);
        }
        button.secondary:hover { background-color: var(--bg-tertiary); }
        button.highlight { border: 2px solid var(--accent); color: var(--accent); font-weight: bold; background: transparent; }
        button.add-btn { background-color: var(--success); }
        button.add-btn:hover { background-color: var(--success-hover); }
        button.danger { background-color: var(--danger); }
        button.danger:hover { background-color: var(--danger-hover); }

        /* Magnet button state */
        button.magnet-on {
            background-color: var(--warning) !important;
            color: #000000 !important;
            border-color: #ef6c00 !important;
            font-weight: 500;
        }
        button.magnet-on:hover { background-color: #f57c00 !important; }

        /* Theme button special styling */
        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .theme-btn .theme-name { font-size: 0.8rem; }

        #fileInput, #linkColorInput { display: none; }

        .gantt_grid_scale .gantt_grid_head_cell {
            white-space: normal !important;
            line-height: normal !important;
            vertical-align: middle;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
        }

        .search-header-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .search-header-input {
            width: 90%;
            padding: 4px 8px;
            box-sizing: border-box;
            margin-top: 5px;
            font-size: 12px;
            border-radius: 15px;
            border: 1px solid var(--input-border);
            font-weight: normal; 
            outline: none;
            touch-action: manipulation;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s, background-color 0.25s, color 0.25s;
        }
        .search-header-input:focus {
            border-color: var(--accent);
        }

        #gantt_here {
            width: 100%;
            flex: 1 1 auto; min-height: 0;
            background: var(--bg-primary); position: relative;
            touch-action: pan-x pan-y;
            -webkit-touch-callout: none;
            transition: background-color 0.25s;
        }
        #gantt_here .gantt_task, #gantt_here .gantt_grid_data {
            user-select: none; -webkit-user-select: none;
        }

        .gantt_task_scale { cursor: ew-resize !important; } 
        .gantt_task_content { cursor: grab; }

        .weekend { background: var(--weekend-bg) !important; }
        .gantt_drag_move { cursor: grabbing !important; }
        .gantt_task_line { border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
        .gantt_task_progress { background-color: rgba(0,0,0,0.2); }

        /* Gantt Chart Theme Overrides */
        .gantt_grid_data, .gantt_task_data {
            background: var(--bg-primary) !important;
        }
        .gantt_cell {
            border-color: var(--gantt-border) !important;
            color: var(--text-primary) !important;
        }
        .gantt_task_cell {
            border-color: var(--gantt-border) !important;
        }
        .gantt_row.odd { background-color: var(--gantt-row-alt) !important; }
        .gantt_row:hover, .gantt_row.odd:hover { background-color: var(--gantt-cell-hover) !important; }
        .gantt_task_row.odd { background-color: var(--gantt-row-alt) !important; }
        .gantt_task_row:hover, .gantt_task_row.odd:hover { background-color: var(--gantt-cell-hover) !important; }
        .gantt_grid_head_cell, .gantt_scale_cell {
            background: var(--gantt-header) !important;
            color: var(--gantt-header-text) !important;
            border-color: var(--gantt-border) !important;
        }
        .gantt_grid_scale, .gantt_task_scale {
            background: var(--gantt-header) !important;
            border-color: var(--gantt-border) !important;
        }
        .gantt_hor_layer, .gantt_ver_layer { background-color: var(--accent) !important; }
        .gantt_grid_data .gantt_row.selected, .gantt_grid_data .gantt_row.odd.selected {
            background: var(--accent) !important;
            color: var(--accent-text) !important;
        }
        /* Lightbox / modal theming */
        .gantt_cal_light, .gantt_cal_light_wide {
            background: var(--bg-elevated) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            box-shadow: 0 4px 20px var(--shadow-strong);
        }
        .gantt_cal_light .gantt_cal_ltitle {
            background: var(--gantt-header) !important;
            color: var(--gantt-header-text) !important;
            border-bottom: 1px solid var(--border-color) !important;
        }
        .gantt_cal_light .gantt_cal_larea {
            background: var(--bg-elevated) !important;
            color: var(--text-primary) !important;
        }
        .gantt_cal_light input, .gantt_cal_light select, .gantt_cal_light textarea {
            background: var(--input-bg) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--input-border) !important;
        }
        .gantt_cal_light .gantt_btn_set {
            background: var(--bg-secondary) !important;
            border-top: 1px solid var(--border-color) !important;
        }
        .gantt_tooltip {
            background: var(--tooltip-bg) !important;
            color: var(--tooltip-text) !important;
            border: none !important;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* Theme-aware scrollbar (webKit) */
        .gantt_hor_scrollbar div, .gantt_ver_scrollbar div {
            background: var(--bg-tertiary) !important;
        }
        .gantt_hor_scrollbar .gantt_scroll_thumb, .gantt_ver_scrollbar .gantt_scroll_thumb {
            background: var(--border-color) !important;
        }

        .color-picker-container {
            display: flex; align-items: center; padding: 5px 10px; height: 30px;
        }
        .color-picker-container input {
            width: 100%; height: 25px; border: 1px solid var(--input-border); cursor: pointer; background: none;
            border-radius: 4px;
        }

        .today {
            background: none; 
            border-left: 2px dotted var(--today-line); 
            width: 0 !important; 
        }

        .zoom-controls {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: calc(14px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            z-index: 100;
        }
        .zoom-controls button {
            width: 46px; height: 46px; border-radius: 50%;
            padding: 0; font-size: 1.25rem; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 10px var(--shadow-strong);
        }
        .zoom-label {
            background: var(--bg-elevated); border: 1px solid var(--border-color); color: var(--text-secondary);
            border-radius: 10px; padding: 2px 8px; font-size: 0.68rem; font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.4px;
            box-shadow: 0 1px 4px var(--shadow);
        }

        #linkEditorModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-bg); z-index: 1000; align-items: center; justify-content: center;
            padding: 16px; box-sizing: border-box;
        }
        #linkEditorModal.show { display: flex; }
        .link-editor-content {
            background: var(--bg-elevated); padding: 20px; border-radius: 8px;
            width: 400px; max-width: 100%;
            max-height: calc(100vh - 40px); overflow-y: auto;
            box-shadow: 0 4px 12px var(--shadow-strong);
            box-sizing: border-box;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .link-editor-content h3 { margin: 0 0 15px 0; color: var(--text-primary); }
        .link-editor-row { margin-bottom: 15px; }
        .link-editor-row label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-secondary); }
        .link-editor-row input, .link-editor-row select {
            width: 100%; padding: 10px 8px; border: 1px solid var(--input-border); border-radius: 4px;
            box-sizing: border-box; background: var(--input-bg); color: var(--text-primary);
        }
        .link-editor-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .link-editor-buttons button { flex: 1; }
        .btn-delete { background: var(--danger) !important; }

        .save-indicator {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--tooltip-bg);
            color: var(--tooltip-text);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, background-color 0.25s, color 0.25s;
            z-index: 9999;
            pointer-events: none;
        }
        .save-indicator.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Theme picker dropdown */
        .theme-picker-wrapper {
            position: relative;
            display: inline-block;
        }
        .theme-picker-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow-strong);
            min-width: 180px;
            z-index: 100;
            overflow: hidden;
        }
        .theme-picker-dropdown.show { display: block; }
        .theme-picker-dropdown button {
            width: 100%;
            background: transparent;
            color: var(--text-primary);
            border: none;
            border-radius: 0;
            padding: 10px 14px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: background 0.15s;
        }
        .theme-picker-dropdown button:hover {
            background: var(--bg-tertiary);
        }
        .theme-picker-dropdown button.active-theme {
            background: var(--gantt-cell-hover);
            font-weight: 600;
        }
        .theme-picker-dropdown button.active-theme::after {
            content: "✓";
            margin-left: auto;
            color: var(--accent);
            font-weight: bold;
        }

        @media (max-width: 1000px) {
            .instruction { display: none; }
        }

        @media (max-width: 768px) {
            .gantt_cal_light, .gantt_cal_light_wide {
                width: 100vw !important; max-width: 100vw !important;
                left: 0 !important; top: 0 !important;
                height: 100% !important; max-height: 100% !important;
                border-radius: 0; box-sizing: border-box; overflow-y: auto;
            }
            .gantt_cal_light select, .gantt_cal_light input, .gantt_cal_light textarea,
            .link-editor-content select, .link-editor-content input,
            .search-header-input { font-size: 16px; }
        }

        @media (max-width: 760px) {
            .controls { min-height: 0; padding: 8px 12px; }
            .controls h2 { flex: 1 1 100%; font-size: 1rem; }
            .toolbar-right { width: 100%; }
            button { padding: 10px 12px; font-size: 0.85rem; min-height: 42px; }
            .theme-btn .theme-name { display: none; } /* Hide text on mobile, show only emoji */
        }
    </style>
    <style id="dynamic-link-styles"></style>
</head>
<body>

<div class="controls">
    <h2>IGEV - Intuitive Gantt Editor and Viewer</h2>
    <div class="toolbar-right">
        <div class="instruction">
            Header Wheel: ↔️ Time only | Body Wheel: ↔️ Time + ↕️ Height | Touch: pinch to zoom
        </div>
        <input type="file" id="fileInput" accept=".json">
        <input type="color" id="linkColorInput"> 
        <button class="secondary" id="gridToggleBtn" onclick="toggleGrid()" title="Show/hide the task list">📋 Hide List</button>
        <button class="secondary" id="magnetToggleBtn" onclick="toggleMagnetism()" title="Snap tasks to grid units when dragging">🧲 Snap: Off</button>
        
        <!-- THEME PICKER -->
        <div class="theme-picker-wrapper">
            <button class="secondary theme-btn" id="themeToggleBtn" onclick="toggleThemePicker(event)" title="Change theme">
                <span id="themeIcon">☀️</span>
                <span class="theme-name" id="themeName">Light</span>
            </button>
            <div class="theme-picker-dropdown" id="themePickerDropdown">
                <button data-theme="light" onclick="applyTheme('light')">☀️ Light</button>
                <button data-theme="dark" onclick="applyTheme('dark')">🌙 Dark</button>
                <button data-theme="material" onclick="applyTheme('material')">🎨 Material</button>
                <button data-theme="contrast" onclick="applyTheme('contrast')">♿ High Contrast</button>
            </div>
        </div>

        <button class="secondary highlight" onclick="document.getElementById('fileInput').click()">📂 Load JSON</button>
        <button onclick="saveData()">💾 Export</button>
        <button class="danger" onclick="clearSavedState()" title="Clear all locally saved data and start fresh">🗑️ Reset</button>
    </div>
</div>

<div id="gantt_here"></div>

<div class="zoom-controls">
    <button id="zoomInBtn" aria-label="Zoom in" title="Zoom in">＋</button>
    <span class="zoom-label" id="zoomLabel">month</span>
    <button id="zoomOutBtn" aria-label="Zoom out" title="Zoom out">－</button>
</div>

<div class="save-indicator" id="saveIndicator">✓ Progress saved</div>

<div id="linkEditorModal">
    <div class="link-editor-content">
        <h3>Edit Dependency</h3>
        <div class="link-editor-row">
            <label>Line Color:</label>
            <input type="color" id="linkEditorColor">
        </div>
        <div class="link-editor-row">
            <label>Type:</label>
            <select id="linkEditorType">
                <option value="0">Finish to Start</option>
                <option value="1">Start to Start</option>
                <option value="2">Finish to Finish</option>
                <option value="3">Start to Finish</option>
            </select>
        </div>
        <div class="link-editor-buttons">
            <button onclick="saveLinkEdit()">💾 Save</button>
            <button class="btn-delete" onclick="deleteLinkEdit()">🗑️ Delete</button>
            <button class="secondary" onclick="closeLinkEditor()">Cancel</button>
        </div>
    </div>
</div>

<script>
    // ===================================================================
    // THEME DEFINITIONS
    // ===================================================================
    const themes = {
        light: {
            name: "Light",
            icon: "☀️",
            skin: "dhtmlxgantt.css",
            bodyClass: "theme-light"
        },
        dark: {
            name: "Dark",
            icon: "🌙",
            skin: "dhtmlxgantt.css", // Uses CSS variables for full dark override
            bodyClass: "theme-dark"
        },
        material: {
            name: "Material",
            icon: "🎨",
            skin: "dhtmlxgantt_material.css",
            bodyClass: "theme-material"
        },
        contrast: {
            name: "High Contrast",
            icon: "♿",
            skin: "dhtmlxgantt_contrast_black.css",
            bodyClass: "theme-contrast"
        }
    };

    let currentTheme = "light";

    function applyTheme(themeName, save = true) {
        if (!themes[themeName]) themeName = "light";
        currentTheme = themeName;
        const theme = themes[themeName];

        // 1. Update body class
        document.body.className = theme.bodyClass;

        // 2. Update the DHTMLX Gantt skin stylesheet
        const skinLink = document.getElementById('ganttSkinLink');
        const newHref = `https://cdn.jsdelivr.net/npm/dhtmlx-gantt@8.0.6/codebase/${theme.skin}`;
        if (skinLink.href !== newHref) {
            skinLink.href = newHref;
        }

        // 3. Update the theme button UI
        document.getElementById('themeIcon').textContent = theme.icon;
        document.getElementById('themeName').textContent = theme.name;

        // 4. Highlight active theme in dropdown
        document.querySelectorAll('.theme-picker-dropdown button').forEach(btn => {
            if (btn.dataset.theme === themeName) btn.classList.add('active-theme');
            else btn.classList.remove('active-theme');
        });

        // 5. Close the dropdown
        document.getElementById('themePickerDropdown').classList.remove('show');

        // 6. Re-render gantt to apply skin changes
        if (typeof gantt !== 'undefined' && gantt.$task) {
            // Force a full re-render
            setTimeout(() => {
                gantt.render();
                restoreSearchInput();
            }, 50);
        }

        // 7. Save to storage
        if (save) scheduleSave();
    }

    function toggleThemePicker(event) {
        if (event) event.stopPropagation();
        const dropdown = document.getElementById('themePickerDropdown');
        dropdown.classList.toggle('show');
    }

    // Close theme picker when clicking elsewhere
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('themePickerDropdown');
        const btn = document.getElementById('themeToggleBtn');
        if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.classList.remove('show');
        }
    });

    // ===================================================================
    // LOCAL STORAGE PERSISTENCE MODULE
    // ===================================================================
    const STORAGE_KEY = 'igev_gantt_state';
    let saveTimeout = null;

    function showSaveIndicator() {
        const el = document.getElementById('saveIndicator');
        el.classList.add('visible');
        setTimeout(() => el.classList.remove('visible'), 1500);
    }

    function saveStateToStorage(showToast = true) {
        try {
            const scrollState = gantt.getScrollState();
            const state = {
                version: 4, // bumped for theme state
                timestamp: Date.now(),
                data: gantt.serialize(),
                zoomIndex: currentZoomIndex,
                activeRowHeight: activeRowHeight,
                showGrid: gantt.config.show_grid,
                searchText: currentSearch,
                scrollX: scrollState.x || 0,
                scrollY: scrollState.y || 0,
                snapEnabled: snapEnabled,
                theme: currentTheme
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            if (showToast) showSaveIndicator();
        } catch (e) {
            console.warn('Failed to save state to localStorage:', e);
        }
    }

    function loadStateFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            const state = JSON.parse(raw);
            if (!state || !state.data || !state.data.data) return null;
            return state;
        } catch (e) {
            console.warn('Failed to load state from localStorage:', e);
            return null;
        }
    }

    function clearSavedState() {
        if (confirm('Clear all saved progress and start fresh?')) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    function scheduleSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => saveStateToStorage(true), 800);
    }

    // ===================================================================
    // DEVICE DETECTION HELPERS
    // ===================================================================
    const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
    const isSmallScreen = window.matchMedia('(max-width: 767px)').matches;

    // ===================================================================
    // CUSTOM COLOR PICKER
    // ===================================================================
    gantt.form_blocks["color_picker"] = {
        render: function (sns) {
            return "<div class='color-picker-container'><input type='color'></div>";
        },
        set_value: function (node, value, task) {
            let defaultColor = "#3db9d3";
            if (task.type === "milestone") defaultColor = "#e91e63";
            if (task.type === "project") defaultColor = "#4caf50";
            node.querySelector("input").value = value || defaultColor;
        },
        get_value: function (node, task) { return node.querySelector("input").value; },
        focus: function (node) { node.querySelector("input").focus(); }
    };

    // ===================================================================
    // TOUCH SUPPORT CONFIG
    // ===================================================================
    gantt.config.touch = true;
    gantt.config.touch_drag = true;
    gantt.config.touch_feedback = true;

    // ===================================================================
    // MAGNETISM / SNAP STATE
    // ===================================================================
    let snapEnabled = false;

    function applyMagnetismState() {
        gantt.config.round_dnd_dates = snapEnabled;
        gantt.config.round_task_dates = snapEnabled;
    }

    function toggleMagnetism(forceState) {
        const target = (forceState === undefined) ? !snapEnabled : forceState;
        snapEnabled = !!target;
        applyMagnetismState();
        updateMagnetBtn();
        scheduleSave();
    }

    function updateMagnetBtn() {
        const btn = document.getElementById('magnetToggleBtn');
        if (!btn) return;
        if (snapEnabled) {
            btn.innerHTML = '🧲 Snap: On';
            btn.classList.add('magnet-on');
            btn.classList.remove('secondary');
        } else {
            btn.innerHTML = '🧲 Snap: Off';
            btn.classList.remove('magnet-on');
            btn.classList.add('secondary');
        }
    }

    applyMagnetismState();

    // ===================================================================
    // CONFIGURATION
    // ===================================================================
    gantt.config.order_branch = true;
    gantt.config.order_branch_free = true;

    const searchHeaderHTML = `
        <div class='search-header-wrapper'>
            Task Name
            <input type='text' class='search-header-input' placeholder='🔍 Search...' oninput='applyFilter(this.value)' onclick='event.stopPropagation()' onmousedown='event.stopPropagation()' ontouchstart='event.stopPropagation()'>
        </div>`;

    const ganttColumns = [
        { name: "text", label: searchHeaderHTML, tree: true, width: isSmallScreen ? 165 : 250, min_width: isSmallScreen ? 120 : 150, resize: true },
        { name: "start_date", label: "Start", align: "center", width: isSmallScreen ? 65 : 90, resize: true }
    ];
    if (!isSmallScreen) {
        ganttColumns.push({ name: "duration", label: "Days", align: "center", width: 50 });
    }
    ganttColumns.push({ name: "add", width: isSmallScreen ? 38 : 44 });
    gantt.config.columns = ganttColumns;

    gantt.locale.labels.section_type = "Element Type";
    gantt.locale.labels.section_task_color = "Item Color";
    gantt.locale.labels.section_text_color = "Label Color";

    gantt.config.lightbox.sections = [
        {name: "type", type: "typeselect", map_to: "type"},
        {name: "description", height: 70, map_to: "text", type: "textarea", focus: true},
        {name: "task_color", height: 30, map_to: "color", type: "color_picker"},
        {name: "text_color", height: 30, map_to: "textColor", type: "color_picker"},
        {name: "time", height: 72, type: "duration", map_to: "auto"}
    ];

    gantt.config.lightbox.project_sections = [
        {name: "type", type: "typeselect", map_to: "type"},
        {name: "description", height: 70, map_to: "text", type: "textarea", focus: true},
        {name: "task_color", height: 30, map_to: "color", type: "color_picker"},
        {name: "text_color", height: 30, map_to: "textColor", type: "color_picker"}
    ];

    gantt.config.lightbox.milestone_sections = [
        {name: "type", type: "typeselect", map_to: "type"},
        {name: "description", height: 70, map_to: "text", type: "textarea", focus: true},
        {name: "task_color", height: 30, map_to: "color", type: "color_picker"}, 
        {name: "text_color", height: 30, map_to: "textColor", type: "color_picker"},
        {name: "time", height: 72, type: "duration", map_to: "auto", single_date: true} 
    ];

    gantt.config.date_format = "%Y-%m-%d %H:%i";
    gantt.config.xml_date = "%Y-%m-%d %H:%i";
    gantt.templates.timeline_cell_class = (task, date) => (date.getDay()==0||date.getDay()==6) ? "weekend" : "";
    gantt.templates.link_class = (link) => "link_id_" + link.id;

    gantt.plugins({ 
        tooltip: true, 
        drag_timeline: true, 
        marker: true 
    });

    gantt.config.drag_timeline = { ignore: ".gantt_task_line", useKey: false };

    // ===================================================================
    // SEARCH STATE
    // ===================================================================
    let currentSearch = "";
    function restoreSearchInput() {
        const el = document.querySelector('.search-header-input');
        if (el && el.value !== currentSearch) el.value = currentSearch;
    }

    // ===================================================================
    // CUSTOM ZOOM LEVELS
    // ===================================================================
    const zoomLevels = [
        { name: "year", scale_height: 60, row_height: 25, min_column_width: 30, scales: [{unit: "year", step: 1, format: "%Y"}]},
        { name: "quarter", scale_height: 60, row_height: 30, min_column_width: 90, scales: [{unit: "year", step: 1, format: "%Y"}, {unit: "quarter", step: 1, format: (d) => "Q" + (Math.floor(d.getMonth() / 3) + 1)}]},
        { name: "month", scale_height: 60, row_height: 35, min_column_width: 120, scales: [{unit: "month", format: "%F, %Y"}, {unit: "week", format: "Week %W"}]},
        { name: "week", scale_height: 60, row_height: 45, min_column_width: 50, scales: [{unit: "month", format: "%M %Y"}, {unit: "day", step: 1, format: "%d %D"}]},
        { name: "day", scale_height: 60, row_height: 60, min_column_width: 80, scales: [{unit: "month", format: "%M %Y"}, {unit: "day", step: 1, format: "%d %M"}]}
    ];

    let currentZoomIndex = 2;
    let activeRowHeight = zoomLevels[currentZoomIndex].row_height; 

    function updateZoomLabel() {
        const labelEl = document.getElementById('zoomLabel');
        if (labelEl) labelEl.textContent = zoomLevels[currentZoomIndex].name;
    }

    function applyZoom(nextIndex, clientX, clientY, anchorInHeader) {
        if (!gantt.$task) return;
        if (nextIndex < 0) nextIndex = 0;
        if (nextIndex >= zoomLevels.length) nextIndex = zoomLevels.length - 1;
        if (nextIndex === currentZoomIndex) return;

        const taskRect = gantt.$task.getBoundingClientRect();
        const offsetX = clientX - taskRect.left;
        const offsetY = clientY - taskRect.top;
        const state = gantt.getScrollState();
        const absoluteX = state.x + offsetX;
        const absoluteY = state.y + offsetY;

        const cursorDate = gantt.dateFromPos(absoluteX);
        const cursorRowIndex = absoluteY / activeRowHeight;

        const nextLevel = zoomLevels[nextIndex];
        currentZoomIndex = nextIndex;

        gantt.config.scales = nextLevel.scales;
        gantt.config.min_column_width = nextLevel.min_column_width;

        if (anchorInHeader) {
            gantt.config.row_height = activeRowHeight;
        } else {
            activeRowHeight = nextLevel.row_height;
            gantt.config.row_height = activeRowHeight;
        }

        gantt.render();
        restoreSearchInput();
        updateZoomLabel();

        const newAbsoluteX = gantt.posFromDate(cursorDate);
        const newScrollLeft = newAbsoluteX - offsetX;

        let newScrollTop;
        if (!anchorInHeader) {
            const newRowHeight = gantt.config.row_height;
            const newAbsoluteY = cursorRowIndex * newRowHeight;
            newScrollTop = newAbsoluteY - offsetY;
        } else {
            newScrollTop = state.y;
        }

        gantt.scrollTo(Math.max(0, newScrollLeft), Math.max(0, newScrollTop));
        scheduleSave();
    }

    if (window.innerWidth < 560) {
        gantt.config.show_grid = false;
    }

    function initManualZoom() {
        const level = zoomLevels[currentZoomIndex];
        gantt.config.scales = level.scales;
        gantt.config.min_column_width = level.min_column_width;
        gantt.config.scale_height = level.scale_height;
        gantt.config.row_height = activeRowHeight;
        gantt.init("gantt_here");
        updateZoomLabel();
    }
    initManualZoom();

    function reinitTodayMarker() {
        const date_to_str = gantt.date.date_to_str(gantt.config.task_date);
        gantt.addMarker({
            start_date: new Date(),
            css: "today",
            title: "Today: " + date_to_str(new Date()) 
        });
    }

    reinitTodayMarker();

    // ===================================================================
    // GRID TOGGLE
    // ===================================================================
    function toggleGrid(forceState) {
        const target = (forceState === undefined) ? !gantt.config.show_grid : forceState;
        if (gantt.config.show_grid !== target) {
            gantt.config.show_grid = target;
            gantt.render();
            restoreSearchInput();
            scheduleSave();
        }
        updateGridToggleBtn();
    }
    function updateGridToggleBtn() {
        const btn = document.getElementById('gridToggleBtn');
        if (btn) btn.innerHTML = gantt.config.show_grid ? "📋 Hide List" : "📋 Show List";
    }
    updateGridToggleBtn();

    // ===================================================================
    // DATA LOGIC
    // ===================================================================
    window.applyFilter = function(query) {
        currentSearch = query;
        gantt.refreshData();
        setTimeout(scrollToFirstVisible, 40);
        scheduleSave();
    };

    function processGanttData(jsonData) {
        if(jsonData.data && jsonData.data.length > 0 && !jsonData.data[0].subtasks && jsonData.data[0].id) {
            if(jsonData.links) jsonData.links.forEach(l => { if(l.color) injectLinkColorStyle(l.id, l.color); });
            return jsonData;
        }

        const tasks = [];
        const links = [];
        let linkIdCounter = 1;

        function recurse(items, parentId) {
            if(!items) return;
            items.forEach(item => {
                const currentId = item.TaskID || item.id;
                
                let elemType = item.type;
                if (!elemType) {
                    elemType = (item.Duration === 0 || item.duration === 0) ? "milestone" : "task";
                }

                let finalColor = "#3db9d3";
                if (elemType === "milestone") finalColor = "#e91e63";
                if (elemType === "project") finalColor = "#4caf50";

                if(item.color) {
                    if(item.color.startsWith("#")) finalColor = item.color;
                    else if(item.color.length >= 3) finalColor = "#" + item.color;
                }

                tasks.push({
                    id: currentId,
                    text: item.TaskName || item.text || "New Element",
                    start_date: item.StartDate || item.start_date ? new Date(item.StartDate || item.start_date) : new Date(),
                    duration: item.Duration || item.duration || 0,
                    parent: parentId || 0,
                    open: item.open !== undefined ? item.open : true,
                    progress: (item.Progress || item.progress || 0) / 100,
                    type: elemType,
                    color: finalColor,
                    textColor: item.textColor || "#ffffff"
                });

                if (item.Predecessor) {
                    const sourceId = parseInt(item.Predecessor);
                    if (!isNaN(sourceId)) {
                        links.push({ id: linkIdCounter++, source: sourceId, target: currentId, type: "0", color: "#ffa011" });
                    }
                }
                if (item.subtasks) recurse(item.subtasks, currentId);
            });
        }
        recurse(jsonData.data || jsonData, null);
        return { data: tasks, links: links };
    }

    // ===================================================================
    // LINK EDITING
    // ===================================================================
    let currentEditingLinkId = null;
    gantt.attachEvent("onLinkDblClick", function(id){
        if(gantt.isLinkExists(id)) openLinkEditor(id);
        return false;
    });

    let linkTapState = { id: null, time: 0 };
    gantt.attachEvent("onLinkClick", function(id){
        const now = Date.now();
        if (linkTapState.id === id && now - linkTapState.time < 450) {
            linkTapState = { id: null, time: 0 };
            if (gantt.isLinkExists(id)) openLinkEditor(id);
        } else {
            linkTapState = { id: id, time: now };
        }
    });

    let taskTapState = { id: null, time: 0 };
    gantt.attachEvent("onTaskClick", function(id){
        if (!isCoarsePointer) return true;
        const now = Date.now();
        if (taskTapState.id === id && now - taskTapState.time < 450) {
            taskTapState = { id: null, time: 0 };
            gantt.showLightbox(id);
            return false;
        }
        taskTapState = { id: id, time: now };
        return true;
    });

    function openLinkEditor(linkId) {
        const link = gantt.getLink(linkId);
        currentEditingLinkId = linkId;
        document.getElementById('linkEditorColor').value = link.color || "#ffa011";
        document.getElementById('linkEditorType').value = link.type || "0";
        document.getElementById('linkEditorModal').classList.add('show');
    }

    function closeLinkEditor() {
        document.getElementById('linkEditorModal').classList.remove('show');
        currentEditingLinkId = null;
    }

    function saveLinkEdit() {
        if(currentEditingLinkId && gantt.isLinkExists(currentEditingLinkId)) {
            const link = gantt.getLink(currentEditingLinkId);
            link.color = document.getElementById('linkEditorColor').value;
            link.type = document.getElementById('linkEditorType').value;
            injectLinkColorStyle(currentEditingLinkId, link.color);
            gantt.updateLink(currentEditingLinkId);
            closeLinkEditor();
            scheduleSave();
        }
    }

    function deleteLinkEdit() {
        if(currentEditingLinkId && gantt.isLinkExists(currentEditingLinkId)) {
            if(confirm("Delete dependency?")) {
                gantt.deleteLink(currentEditingLinkId);
                closeLinkEditor();
                scheduleSave();
            }
        }
    }

    document.getElementById('linkEditorModal').addEventListener('click', function(e) {
        if(e.target.id === 'linkEditorModal') closeLinkEditor();
    });

    gantt.attachEvent("onAfterLinkUpdate", function(id, link){
        if(link.color) injectLinkColorStyle(id, link.color);
        scheduleSave();
    });

    gantt.attachEvent("onAfterLinkAdd", function(id, link){
        if(link.color) injectLinkColorStyle(id, link.color);
        scheduleSave();
    });

    gantt.attachEvent("onLinkDeleted", function(id){
        scheduleSave();
    });

    function injectLinkColorStyle(linkId, color) {
        const styleSheet = document.getElementById('dynamic-link-styles');
        const rule = `.link_id_${linkId} .gantt_line_wrapper div { background-color: ${color} !important; } 
                      .link_id_${linkId} .gantt_link_arrow { border-left-color: ${color} !important; }`;
        styleSheet.innerText += rule;
    }

    function rebuildAllLinkStyles() {
        const styleSheet = document.getElementById('dynamic-link-styles');
        styleSheet.innerText = "";
        gantt.eachLink(function(link) {
            if (link.color) injectLinkColorStyle(link.id, link.color);
        });
    }

    // ===================================================================
    // FILTER
    // ===================================================================
    function scrollToFirstVisible() {
        let firstTaskId = null;
        gantt.eachTask(function(task){
            if (firstTaskId) return;
            const row = gantt.getTaskRowNode(task.id);
            if (row && row.style && row.style.display !== "none") firstTaskId = task.id;
        });
        if (firstTaskId) {
            try { gantt.showTask(firstTaskId); } catch(e) { gantt.scrollTo(0,0); }
        } else {
            gantt.scrollTo(0,0);
        }
    }

    gantt.attachEvent("onBeforeTaskDisplay", function(id, task){
        const inputEl = document.querySelector('.search-header-input');
        const query = inputEl ? inputEl.value.toLowerCase().trim() : "";
        if(query === "") return true;
        if(task.text.toLowerCase().includes(query)) return true;
        
        function hasMatchingChild(taskId) {
            const children = gantt.getChildren(taskId);
            for(let i = 0; i < children.length; i++) {
                const child = gantt.getTask(children[i]);
                if(child.text.toLowerCase().includes(query)) return true;
                if(hasMatchingChild(children[i])) return true;
            }
            return false;
        }
        if(hasMatchingChild(id)) return true;
        let parentId = task.parent;
        while(parentId && parentId != 0) {
            try {
                const parent = gantt.getTask(parentId);
                if(parent.text.toLowerCase().includes(query)) return true;
                parentId = parent.parent;
            } catch(e) { break; }
        }
        return false;
    });

    // ===================================================================
    // PERSISTENCE: AUTO-SAVE ON DATA CHANGES
    // ===================================================================
    gantt.attachEvent("onAfterTaskAdd", function(id, task) { scheduleSave(); });
    gantt.attachEvent("onAfterTaskUpdate", function(id, task) { scheduleSave(); });
    gantt.attachEvent("onAfterTaskDelete", function(id) { scheduleSave(); });
    gantt.attachEvent("onTaskDrag", function(id, mode, task, original) { scheduleSave(); });
    gantt.attachEvent("onAfterTaskMove", function(id) { scheduleSave(); });

    let scrollSaveTimeout = null;
    gantt.attachEvent("onGanttScroll", function(left, top) {
        clearTimeout(scrollSaveTimeout);
        scrollSaveTimeout = setTimeout(() => saveStateToStorage(false), 1200);
    });

    // ===================================================================
    // FILE IO + LOCAL STORAGE RESTORE
    // ===================================================================
    window.addEventListener('load', () => {
        const savedState = loadStateFromStorage();
        if (savedState) {
            console.log('Restoring saved state from', new Date(savedState.timestamp).toLocaleString());
            
            // Restore theme FIRST (must be applied before other state)
            if (savedState.theme && themes[savedState.theme]) {
                applyTheme(savedState.theme, false);
            }

            if (savedState.snapEnabled !== undefined) {
                snapEnabled = !!savedState.snapEnabled;
                applyMagnetismState();
                updateMagnetBtn();
            }

            if (savedState.zoomIndex !== undefined && savedState.zoomIndex >= 0 && savedState.zoomIndex < zoomLevels.length) {
                currentZoomIndex = savedState.zoomIndex;
                const level = zoomLevels[currentZoomIndex];
                gantt.config.scales = level.scales;
                gantt.config.min_column_width = level.min_column_width;
                gantt.config.scale_height = level.scale_height;
                if (savedState.activeRowHeight) {
                    activeRowHeight = savedState.activeRowHeight;
                } else {
                    activeRowHeight = level.row_height;
                }
                gantt.config.row_height = activeRowHeight;
                updateZoomLabel();
            }

            if (savedState.showGrid !== undefined) {
                gantt.config.show_grid = savedState.showGrid;
                updateGridToggleBtn();
            }

            if (savedState.searchText) {
                currentSearch = savedState.searchText;
            }

            gantt.render();
            gantt.parse(savedState.data);
            rebuildAllLinkStyles();
            restoreSearchInput();

            setTimeout(() => {
                if (savedState.scrollX || savedState.scrollY) {
                    gantt.scrollTo(savedState.scrollX || 0, savedState.scrollY || 0);
                }
            }, 100);

            return;
        }

        // No saved state: apply default Light theme
        applyTheme("light", false);

        fetch('gantt_data.json').then(r => r.ok ? r.json() : null).then(data => {
            if(data) {
                gantt.parse(processGanttData(data));
                setTimeout(() => saveStateToStorage(false), 500);
            }
        }).catch((e) => { console.warn("Local JSON load failed (likely CORS). Use Load JSON button."); });
    });

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                gantt.clearAll(); 
                document.getElementById('dynamic-link-styles').innerText = "";
                currentSearch = "";
                const searchEl = document.querySelector('.search-header-input');
                if(searchEl) searchEl.value = "";
                
                reinitTodayMarker(); 
                gantt.parse(processGanttData(JSON.parse(ev.target.result)));
                rebuildAllLinkStyles();
                setTimeout(() => saveStateToStorage(true), 300);
            } catch (err) { alert("Error parsing JSON"); }
        };
        reader.readAsText(e.target.files[0]);
    });

    function saveData() {
        const blob = new Blob([JSON.stringify(gantt.serialize())], {type: "application/json"});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "gantt_data_saved.json";
        a.click();
    }

    // ===================================================================
    // ZOOM CONTROLS
    // ===================================================================
    const container = document.getElementById("gantt_here");
    let lastZoomTime = 0;

    container.addEventListener('wheel', function(event) {
        const isTimelineContainer = event.target.closest(".gantt_task");
        const isGrid = event.target.closest(".gantt_grid") || event.target.closest(".gantt_grid_scale");

        if (isTimelineContainer && !isGrid) {
            event.preventDefault();
            event.stopPropagation();
            
            const now = Date.now();
            if (now - lastZoomTime < 60) return false; 
            lastZoomTime = now;

            const taskRect = gantt.$task.getBoundingClientRect();
            const offsetY = event.clientY - taskRect.top; 
            const headerHeight = gantt.config.scale_height || 60; 
            const isHeader = offsetY < headerHeight;

            const nextIndex = event.deltaY < 0 ? currentZoomIndex + 1 : currentZoomIndex - 1;
            applyZoom(nextIndex, event.clientX, event.clientY, isHeader);
        }
    }, { passive: false, capture: true });

    let pinchState = null;

    function getTouchDistance(touchList) {
        const dx = touchList[0].clientX - touchList[1].clientX;
        const dy = touchList[0].clientY - touchList[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    container.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2 && e.target.closest('.gantt_task')) {
            pinchState = { distance: getTouchDistance(e.touches) };
        }
    }, { passive: true });

    container.addEventListener('touchmove', function (e) {
        if (!pinchState || e.touches.length !== 2) return;
        e.preventDefault();
        e.stopPropagation();

        const newDistance = getTouchDistance(e.touches);
        if (!newDistance) return;
        const ratio = newDistance / pinchState.distance;

        if (ratio > 1.25 || ratio < 0.8) {
            const now = Date.now();
            if (now - lastZoomTime > 180) {
                lastZoomTime = now;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const taskRect = gantt.$task.getBoundingClientRect();
                const headerHeight = gantt.config.scale_height || 60;
                const inHeader = (midY - taskRect.top) < headerHeight;
                applyZoom(currentZoomIndex + (ratio > 1 ? 1 : -1), midX, midY, inHeader);
            }
            pinchState.distance = newDistance;
        }
    }, { passive: false });

    const endPinch = function (e) {
        if (!e.touches || e.touches.length < 2) pinchState = null;
    };
    container.addEventListener('touchend', endPinch, { passive: true });
    container.addEventListener('touchcancel', endPinch, { passive: true });

    function zoomStepFromUI(delta) {
        const now = Date.now();
        if (now - lastZoomTime < 100) return;
        lastZoomTime = now;
        const taskRect = gantt.$task.getBoundingClientRect();
        const headerHeight = gantt.config.scale_height || 60;
        const centerX = taskRect.left + taskRect.width / 2;
        const centerY = taskRect.top + headerHeight + Math.max(0, (taskRect.height - headerHeight) / 2);
        applyZoom(currentZoomIndex + delta, centerX, centerY, false);
    }
    document.getElementById('zoomInBtn').addEventListener('click', () => zoomStepFromUI(+1));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoomStepFromUI(-1));

    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });

    container.addEventListener('contextmenu', function (e) {
        if (isCoarsePointer) e.preventDefault();
    });

    let resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            gantt.render();
            restoreSearchInput();
        }, 250);
    });

    window.addEventListener('beforeunload', function() {
        saveStateToStorage(false);
    });

    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') {
            saveStateToStorage(false);
        }
    });
</script>
</body>
</html>
